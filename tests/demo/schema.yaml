# Main node type (e.g. of the line of the table).
variant: # The type in the ontology
    represented_as: node
    input_label: variant # The type in the input data can have a different name.
    properties:
        version: str

# Another node type (e.g. of a column of the table).
patient:
    represented_as: node
    input_label: patient
    properties:
        version: str

patient has variant:
    represented_as: edge
    input_label: patient has variant
    source: variant
    target: patient
    properties:
        version: str

